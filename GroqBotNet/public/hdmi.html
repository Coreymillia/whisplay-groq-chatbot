<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GroqBotNet HDMI</title>
    <link rel="stylesheet" href="/hdmi.css" />
  </head>
  <body class="hdmi-body">
    <main class="hdmi-shell">
      <header class="hdmi-header">
        <div>
          <div class="hdmi-title">GroqBotNet HDMI Chat</div>
          <div class="hdmi-subtitle" id="summaryText">Loading conversation state…</div>
        </div>
        <div class="hdmi-meta" id="metaText">Connecting…</div>
      </header>

      <section class="hdmi-card">
        <div class="hdmi-conversation-title" id="conversationTitle">Waiting for activity…</div>
        <div class="hdmi-message-list" id="messageList"></div>
      </section>

      <footer class="hdmi-footer">
        <span id="statusText">Refreshing…</span>
        <a href="/" target="_blank" rel="noopener">Open control page</a>
      </footer>
    </main>

    <script src="/hdmi.js"></script>
  </body>
  </html>
